<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoodMuse</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0f0e17;
      --surface:      #1a1828;
      --surface-2:    #231f35;
      --border:       #2e2a45;
      --accent:       #a78bfa;
      --accent-dark:  #7c3aed;
      --accent-glow:  rgba(167, 139, 250, 0.25);
      --glow-1:       rgba(167, 139, 250, 0.35);
      --glow-2:       rgba(129, 140, 248, 0.28);
      --glow-3:       rgba(196, 181, 253, 0.22);
      --text:         #e8e4f0;
      --text-muted:   #8b7fb8;
      --error:        #f87171;
      --radius:       12px;
      --radius-sm:    8px;
      --font:         'Georgia', 'Times New Roman', serif;
      --font-ui:      system-ui, -apple-system, sans-serif;
    }

    /* ── Ambient background glow ──────────────────────────────────────────── */
    /* Slow-drifting blurred blobs behind everything. Their colors are retinted
       to match the generated image's mood (see applyMoodTheme in the script) —
       the background becomes part of the output, not just decoration around it. */
    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      transition: background 1.2s ease;
    }

    .blob-1 {
      width: 420px; height: 420px;
      top: -12%; left: -8%;
      background: var(--glow-1);
      animation: drift1 26s ease-in-out infinite;
    }

    .blob-2 {
      width: 360px; height: 360px;
      bottom: -14%; right: -6%;
      background: var(--glow-2);
      animation: drift2 32s ease-in-out infinite;
    }

    .blob-3 {
      width: 300px; height: 300px;
      top: 42%; left: 62%;
      background: var(--glow-3);
      animation: drift3 22s ease-in-out infinite;
    }

    @keyframes drift1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(60px, 40px) scale(1.1); }
    }
    @keyframes drift2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(-50px, -30px) scale(1.05); }
    }
    @keyframes drift3 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(-40px, 50px) scale(0.95); }
    }

    @media (prefers-reduced-motion: reduce) {
      .blob { animation: none; }
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      line-height: 1.6;
    }

    body {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    /* ── Header ───────────────────────────────────────────────────────────── */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-family: var(--font);
      font-weight: normal;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #c4b5fd 0%, #a78bfa 50%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      margin-top: 0.5rem;
      color: var(--text-muted);
      font-size: 1rem;
    }

    header p.subtitle {
      max-width: 480px;
      margin: 0.6rem auto 0;
      font-size: 0.85rem;
      line-height: 1.5;
      opacity: 0.8;
    }

    /* ── Input card ───────────────────────────────────────────────────────── */
    .input-card {
      width: 100%;
      max-width: 680px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
    }

    textarea {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 1rem;
      line-height: 1.5;
      padding: 0.75rem 1rem;
      resize: vertical;
      min-height: 80px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea::placeholder { color: var(--text-muted); }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .input-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1rem;
      gap: 1rem;
    }

    #char-count {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    #char-count.near-limit { color: #fb923c; }
    #char-count.at-limit   { color: var(--error); }

    /* ── Generate button ──────────────────────────────────────────────────── */
    #generate-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent-dark);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 0.65rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: var(--font-ui);
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s, opacity 0.2s;
      white-space: nowrap;
    }

    #generate-btn:hover:not(:disabled) {
      background: var(--accent);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    #generate-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* Spinner shown during loading */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    #generate-btn.loading .spinner { display: block; }
    #generate-btn.loading .btn-text::after { content: "…"; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error banner ─────────────────────────────────────────────────────── */
    #error-banner {
      display: none;
      width: 100%;
      max-width: 680px;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.35);
      border-radius: var(--radius-sm);
      color: var(--error);
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    #error-banner.visible { display: block; }

    /* ── Output area ──────────────────────────────────────────────────────── */
    #output {
      display: none;
      width: 100%;
      max-width: 980px;
      gap: 1.5rem;
    }

    #output.visible {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    @media (max-width: 640px) {
      #output.visible { grid-template-columns: 1fr; }
    }

    /* ── Poem card ────────────────────────────────────────────────────────── */
    .poem-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      display: flex;
      flex-direction: column;
    }

    .card-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 1.25rem;
    }

    #poem-text {
      font-family: var(--font);
      font-size: 1.05rem;
      line-height: 1.9;
      color: var(--text);
      flex: 1;
    }

    /* Each poem line fades/rises in with a stagger — set via inline
       animation-delay per line in showOutput(). */
    .poem-line {
      display: block;
      opacity: 0;
      transform: translateY(10px);
      animation: lineIn 0.6s ease forwards;
    }

    @keyframes lineIn {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .poem-line { animation: none; opacity: 1; transform: none; }
    }

    /* ── Image card ───────────────────────────────────────────────────────── */
    .image-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      display: flex;
      flex-direction: column;
    }

    #mood-image {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      display: block;
      /* Fade + soften in when src is set, like a photo developing */
      opacity: 0;
      filter: blur(18px);
      transform: scale(1.02);
      transition: opacity 0.7s ease, filter 0.7s ease, transform 0.7s ease;
    }

    #mood-image.loaded {
      opacity: 1;
      filter: blur(0);
      transform: scale(1);
    }

    @media (prefers-reduced-motion: reduce) {
      #mood-image { transition: opacity 0.3s ease; filter: none; transform: none; }
    }

    /* ── Footer ───────────────────────────────────────────────────────────── */
    footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="bg-glow" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <header>
    <h1>MoodMuse</h1>
    <p>Type a mood or scene &mdash; get a poem and a mood board.</p>
    <p class="subtitle">Describe a feeling or scene, and MoodMuse writes an original poem and paints a matching AI image to go with it &mdash; powered by Amazon Bedrock.</p>
  </header>

  <div class="input-card">
    <label for="prompt-input">Your mood or scene</label>
    <textarea
      id="prompt-input"
      rows="3"
      maxlength="500"
      placeholder="rainy Sunday morning, first day of spring, midnight city lights…"
      aria-label="Mood or scene prompt"
      aria-describedby="char-count"
    ></textarea>
    <div class="input-footer">
      <span id="char-count" aria-live="polite">0 / 500</span>
      <button id="generate-btn" type="button" aria-label="Generate poem and mood board">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-text">Generate</span>
      </button>
    </div>
  </div>

  <div id="error-banner" role="alert" aria-live="assertive"></div>

  <section id="output" aria-label="Generated output" aria-live="polite">
    <div class="poem-card">
      <div class="card-label">Poem</div>
      <p id="poem-text"></p>
    </div>
    <div class="image-card">
      <div class="card-label">Mood Board</div>
      <img id="mood-image" alt="AI-generated mood board image matching your prompt" />
    </div>
  </section>

  <footer>
    Built with <a href="https://aws.amazon.com/bedrock/" target="_blank" rel="noopener">Amazon Bedrock</a>
    &mdash; AWS Builder Center Weekend Challenge
  </footer>

  <script>
    // ── API endpoint ───────────────────────────────────────────────────────────
    // ⚠️  THIS IS THE ONLY LINE THAT CHANGES WHEN YOU DEPLOY FOR REAL.
    // Replace the localhost URL with your API Gateway invoke URL, e.g.:
    //   const API_URL = "https://abc123.execute-api.us-east-1.amazonaws.com/generate";
    const API_URL = "https://qr62vya0w0.execute-api.us-east-1.amazonaws.com/generate";

    // ── Element refs ───────────────────────────────────────────────────────────
    const promptInput  = document.getElementById("prompt-input");
    const charCount    = document.getElementById("char-count");
    const generateBtn  = document.getElementById("generate-btn");
    const errorBanner  = document.getElementById("error-banner");
    const output       = document.getElementById("output");
    const poemText     = document.getElementById("poem-text");
    const moodImage    = document.getElementById("mood-image");

    // ── Character counter ──────────────────────────────────────────────────────
    promptInput.addEventListener("input", () => {
      const len = promptInput.value.length;
      charCount.textContent = `${len} / 500`;
      charCount.classList.toggle("near-limit", len >= 400 && len < 490);
      charCount.classList.toggle("at-limit",   len >= 490);
    });

    // ── State helpers ──────────────────────────────────────────────────────────
    function setLoading(on) {
      generateBtn.disabled = on;
      generateBtn.classList.toggle("loading", on);
      promptInput.disabled = on;
    }

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.classList.add("visible");
      // Hide output while showing error
      output.classList.remove("visible");
    }

    function clearError() {
      errorBanner.textContent = "";
      errorBanner.classList.remove("visible");
    }

    function showOutput(poem, imageB64) {
      // Render poem as a staggered, line-by-line reveal instead of an instant
      // block — each line fades and rises in a beat after the last.
      poemText.innerHTML = "";
      poem.split("\n").forEach((line, i) => {
        const span = document.createElement("span");
        span.className = "poem-line";
        span.style.animationDelay = `${i * 0.15}s`;
        span.textContent = line.length ? line : " "; // keep blank lines visible
        poemText.appendChild(span);
      });

      // Render image with a fade + blur-to-sharp reveal, then retint the UI's
      // accent palette to match the image's dominant color once it's loaded.
      moodImage.classList.remove("loaded");
      moodImage.onload = () => {
        moodImage.classList.add("loaded");
        applyMoodTheme(moodImage);
      };
      moodImage.src = `data:image/png;base64,${imageB64}`;

      output.classList.add("visible");
      // Scroll output into view smoothly
      output.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    // ── Mood-reactive theming ────────────────────────────────────────────────
    // Samples the generated image's dominant color and retints the UI's accent
    // palette (button, focus glow, background blobs) to match — the interface
    // becomes the mood rather than just displaying it next to a fixed theme.
    function applyMoodTheme(imgEl) {
      try {
        const size = 24; // small sample — cheap, plenty for an average color
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(imgEl, 0, 0, size, size);
        const { data } = ctx.getImageData(0, 0, size, size);

        let r = 0, g = 0, b = 0, count = 0;
        for (let i = 0; i < data.length; i += 4) {
          r += data[i]; g += data[i + 1]; b += data[i + 2];
          count++;
        }
        r = Math.round(r / count);
        g = Math.round(g / count);
        b = Math.round(b / count);

        const [h, s] = rgbToHsl(r, g, b);
        const sat = clamp(s, 45, 75);

        // Clamp saturation/lightness so text stays readable and the palette
        // stays in the same "vibrant pastel on dark" family as the default.
        const root = document.documentElement.style;
        root.setProperty("--accent",      hslToCss(h, sat, 74));
        root.setProperty("--accent-dark", hslToCss(h, clamp(s, 50, 80), 48));
        root.setProperty("--accent-glow", hslToCss(h, sat, 60, 0.28));
        root.setProperty("--glow-1", hslToCss(h, 60, 65, 0.35));
        root.setProperty("--glow-2", hslToCss((h + 30) % 360, 55, 60, 0.28));
        root.setProperty("--glow-3", hslToCss((h + 330) % 360, 50, 70, 0.22));
      } catch (e) {
        // Never let a theming failure affect the real poem/image output.
        console.warn("Mood theming skipped:", e);
      }
    }

    function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }

    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s;
      const l = (max + min) / 2;
      if (max === min) {
        h = s = 0;
      } else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          default: h = (r - g) / d + 4;
        }
        h *= 60;
      }
      return [h, s * 100];
    }

    function hslToCss(h, s, l, a) {
      return a === undefined
        ? `hsl(${h.toFixed(0)}, ${s.toFixed(0)}%, ${l}%)`
        : `hsla(${h.toFixed(0)}, ${s.toFixed(0)}%, ${l}%, ${a})`;
    }

    // ── Generate handler ───────────────────────────────────────────────────────
    async function generate() {
      const prompt = promptInput.value.trim();

      if (!prompt) {
        showError("Please enter a mood or scene before generating.");
        return;
      }

      clearError();
      setLoading(true);

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt }),
        });

        // Parse JSON regardless of status so we can read the error message
        let data;
        try {
          data = await response.json();
        } catch {
          throw new Error("The server returned an unexpected response. Please try again.");
        }

        if (!response.ok) {
          throw new Error(data.error || `Server error (${response.status}). Please try again.`);
        }

        if (!data.poem || !data.image_b64) {
          throw new Error("Incomplete response from server. Please try again.");
        }

        showOutput(data.poem, data.image_b64);

      } catch (err) {
        if (err.name === "TypeError" && err.message.includes("fetch")) {
          // Network error — local server probably not running
          showError("Could not reach the server. Make sure local_server.py is running on localhost:8000.");
        } else {
          showError(err.message);
        }
      } finally {
        setLoading(false);
      }
    }

    // ── Event listeners ────────────────────────────────────────────────────────
    generateBtn.addEventListener("click", generate);

    // Allow Ctrl+Enter / Cmd+Enter to submit from the textarea
    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) generate();
    });
  </script>

</body>
</html>
